<!DOCTYPE html>
<html lang="it">

	<head>
		<title>NSHub</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">

		<link href="https://www.nSHub.eu/img/favicon.png" rel="icon" type="image/vnd.microsoft.icon" />
		<link rel="icon" type="image/x-icon" href="https://www.nSHub.eu/img/favicon.ico" />

		<link href="https://www.nSHub.eu/lib/bootstrap/css/bootstrap.min.css" rel="stylesheet" />

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

		<style>
			html,
			main,
			body {
				margin: 0 auto !important;
				padding: 0 !important;
				height: 100% !important;
				width: 100% !important;
				font-family: Montserrat, sans-serif;
			}

			html {
				margin: 0 auto !important;
				padding: 0 !important;
				font-family: Montserrat, sans-serif;
			}

			* {
				-ms-text-size-adjust: 100%;
			}

			table,
			td {
				mso-table-lspace: 0pt !important;
				mso-table-rspace: 0pt !important;
				border-collapse: collapse;
				border-spacing: 0;
			}

			strong,
			h1,
			h2,
			h3,
			h4,
			h5,
			h6 {
				color: #002d5b;
			}

			img {
				-ms-interpolation-mode: bicubic;
			}

			i,
			a,
			a:visited,
			a:hover,
			a:active {
				text-decoration: none;
				color: #002d5b;
			}

			table {
				border-collapse: collapse;
				width: 100%;
			}

			td,
			th {
				text-align: left;
				padding: 8px;
			}

			tr:nth-child(even) {}

			.celle-tabella-principale,
			th.celle-tabella-principale,
			tr.celle-tabella-principale,
			tbody.celle-tabella-principale,
			tfoot.celle-tabella-principale,
			thead.celle-tabella-principale {
				border: none;
				padding: 0px;
				width: 100% !important;
			}

			.celle-tabella-footer {
				border: none;
				padding: 0px;
				width: 100% !important;
				padding-top: 100px;
			}
		</style>
	</head>

	<body width="100%"
		  style="margin: 0; padding: 0 !important; mso-line-height-rule: exactly; height: 100%; font-family: Montserrat, sans-serif;">
		<div style="width:100%; height:100%; height: 100%; ">
			<table style="border: none; width: 100%; height: 100%; table-layout: fixed;  display: table; "
				   cellspacing="0" cellpadding="0" class="celle-tabella-principale " role="presentation">
				<thead class="celle-tabella-principale" style="width: 100%; text-align:center; background-color: rgba(250, 250, 250, 1)!important;">
					<tr class="celle-tabella-principale" style="width: 100%; text-align:center; ">
						<td style="text-align:center; padding:20px; width: 100%; " class="celle-tabella-principale">
							<img width="300" alt="logo" src="https://www.nSHub.eu/img/logo.png" />
						</td>
					</tr>
				</thead>
				<tbody class="celle-tabella-principale "
					   background-color: rgba(250, 250, 250, 1)!important;
					   style="height: 100%!important;  margin: 0;padding: 0; min-height:200px; margin-bottom:80px;  ">
					<tr class="celle-tabella-principale "
						style="height: 100%!important; font-size: 100%;margin: 0;padding: 0; background-color: rgba(250, 250, 250, 1)!important;">
						<td class="celle-tabella-principale"
							style="vertical-align: text-top; padding-bottom:20px; padding-right:10px; padding-left:10px; height: 100%!important; ">
							###NSHubContent###
						</td>
					</tr>
				</tbody>
				<tfoot class="celle-tabella-footer ">
					<tr class="celle-tabella-principale">
						<td class="celle-tabella-principale" style="text-align:center;  padding:5px;">
							<p style="padding:20px; margin:0px;">
								Copyright © <a rel="noreferer" href="http://www.nSHub.eu/" target="_blank">
									<strong style="color: #999999;">Davide NAVA – Software gestionali</strong>
								</a> |
								<a href="mailto:info@nSHub.eu">info@nSHub.eu</a>
							</p>
						</td>
					</tr>
				</tfoot>
			</table>
		</div>
	</body>

</html>
