<dx-drawer class="drawer"
           position="before"
           [closeOnOutsideClick]="drawerState.shaderEnabled()"
           [openedStateMode]="drawerState.menuMode()"
           [revealMode]="drawerState.menuRevealMode()"
           [minSize]="drawerState.minMenuSize()"
           [shading]="drawerState.shaderEnabled()"
           [opened]="drawerState.menuOpened()"
           (openedChange)="drawerState.menuOpened.set($event)">
  <app-side-navigation-menu [compactMode]="!drawerState.menuOpened()"
                            [selectedItem]="drawerState.selectedRoute()"
                            [class]="drawerState.swatchClassName()"
                            *dxTemplate="let dataMenu of 'panel'"
                            (selectedItemChanged)="onNavigationChanged($event)"
                            (openMenu)="drawerState.handleNavigationClick()">
    <dx-toolbar id="navigation-header">
      @if (drawerState.minMenuSize() !== 0) {
      <dxi-toolbar-item location="before"
                        cssClass="menu-button"
                        widget="dxButton"
                        [options]="{
            icon: 'menu',
            stylingMode: 'text',
            onClick: onMenuToggleClick,
            elementAttr: { 'aria-label': 'Toggle menu' }
          }">
      </dxi-toolbar-item>
      }
      <dxi-toolbar-item location="before"
                        cssClass="header-title"
                        [text]="title()">
      </dxi-toolbar-item>
    </dx-toolbar>
  </app-side-navigation-menu>

  <div class="container">
    <app-header [menuToggleEnabled]="drawerState.minMenuSize() === 0"
                (menuToggle)="drawerState.toggleMenu()">
    </app-header>

    <dx-scroll-view #scrollView
                    class="layout-body with-footer">
      <div class="content">
        <ng-content></ng-content>
      </div>

      <div class="content-block">
        <ng-content select="app-footer"></ng-content>
      </div>
    </dx-scroll-view>
  </div>
</dx-drawer>
