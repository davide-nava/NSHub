<div class="content-block dx-card responsive-paddings">
  <div class="form-avatar">
    <img [src]="avatarUrl()"
         [alt]="employee().FirstName + ' ' + employee().LastName + ' avatar'"
         width="120"
         height="120" />
  </div>
  <span>{{ employee().Notes }}</span>
</div>

<div class="content-block dx-card responsive-paddings">
  <dx-form id="form"
           [formData]="employee()"
           labelLocation="top"
           [colCountByScreen]="colCountByScreen()">
  </dx-form>
</div>
